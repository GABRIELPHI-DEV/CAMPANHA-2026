<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral da Campanha</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #0f172a; /* Fundo escuro elegante */
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
            color: #ffffff;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Caixa Centralizada da Planilha */
        .spreadsheet-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        /* Iframe com a URL purificada e corrigida caractere por caractere */
        iframe {
            width: 100%;
            height: 780px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Controle Eleitoral 2026</h1>
            <p>Navegue utilizando as abas originais localizadas no rodapé da planilha</p>
        </header>

        <div class="spreadsheet-box">
            <div class="wrapper">
                <!-- URL purificada sem caracteres especiais codificados incorretamente -->
                <iframe src="https://google.com"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
