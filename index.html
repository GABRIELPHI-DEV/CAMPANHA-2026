<title>Campanha 2026 — Painel de Estatísticas</title>
<style>
  :root{
    --bg-main:#0a0f1e;
    --bg-card:#131b30;
    --bg-item2:#182140;
    --border-color:#28324d;
    --text-main:#f8fafc;
    --text-muted:#8b96ab;

    --federal:#3b82f6;
    --estadual:#a855f7;
    --financeiro:#eab308;
    --resumo:#10b981;

    --green:#10b981;   --green-bg:rgba(16,185,129,.14);
    --amber:#eab308;   --amber-bg:rgba(234,179,8,.14);
    --red:#ef4444;     --red-bg:rgba(239,68,68,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #16224a 0%, transparent 60%),
      var(--bg-main);
    color:var(--text-main);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding:0 0 40px 0;
  }
  .container{max-width:720px; margin:0 auto; padding:0 14px;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes pulseRing{ 0%{transform:scale(.6); opacity:.55;} 70%{opacity:0;} 100%{transform:scale(1.9); opacity:0;} }
  @keyframes shimmer{ 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  .hero-banner .overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,15,30,.35) 0%, rgba(10,15,30,.55) 55%, rgba(10,15,30,.96) 100%);
  }
  .hero-banner .content{position:relative; padding:20px 20px 22px 20px; width:100%;}
  .hero-banner .eyebrow{
    display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:#93c5fd; background:rgba(59,130,246,.16); border:1px solid rgba(59,130,246,.35);
    padding:4px 10px; border-radius:20px; margin-bottom:10px;
  }
  .hero-banner .eyebrow .live-dot{width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 0 rgba(52,211,153,.6); animation:livepulse 1.8s infinite;}
  @keyframes livepulse{ 0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);} 70%{box-shadow:0 0 0 8px rgba(52,211,153,0);} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0);} }
  .hero-banner h1{font-size:clamp(20px,5.5vw,28px); font-weight:800; letter-spacing:-.3px; text-shadow:0 2px 10px rgba(0,0,0,.4);}
  .hero-banner p{font-size:12.5px; color:#cdd6e8; margin-top:5px; max-width:420px;}

  /* ---- estatistica principal ---- */
  .hero{
    background:linear-gradient(135deg,#111a30,#161f3d);
    border:1px solid var(--border-color);
    border-radius:20px;
    padding:22px 18px;
    margin-bottom:14px;
    text-align:center;
    position:relative; overflow:hidden;
    animation:fadeUp .5s ease both; animation-delay:.05s;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.05) 50%, transparent 80%);
    background-size:200% 100%; animation:shimmer 5s linear infinite;
  }
  .hero .tag{font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); position:relative;}
  .hero .big{font-size:44px; font-weight:800; margin:8px 0 2px 0; position:relative; transition:color .4s ease;}
  .hero .sub{font-size:13px; color:var(--text-muted); position:relative;}
  .hero .ring-track{height:10px; border-radius:6px; background:#0b1120; margin-top:16px; overflow:hidden; position:relative;}
  .hero .ring-fill{height:100%; border-radius:6px; width:0; transition:width 1.1s cubic-bezier(.22,1,.36,1), background .4s ease;}

  .tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:16px;}
  .tab-btn{
    background:var(--bg-card); border:1px solid var(--border-color); color:var(--text-muted);
    padding:12px 4px 10px 4px; border-radius:13px; font-size:11px; font-weight:700; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:transform .18s ease, background .25s ease, border-color .25s ease, color .25s ease;
  }
  .tab-btn:active{transform:scale(.95);}
  .tab-btn svg{width:18px; height:18px; opacity:.75; transition:opacity .25s ease;}
  .tab-btn.active svg{opacity:1;}
  .tab-btn.active{color:#fff; transform:translateY(-1px);}
  .tab-btn[data-tab="federal"].active{background:rgba(59,130,246,.18); border-color:var(--federal); color:#93c5fd; box-shadow:0 6px 16px -6px rgba(59,130,246,.5);}
  .tab-btn[data-tab="estadual"].active{background:rgba(168,85,247,.18); border-color:var(--estadual); color:#d8b4fe; box-shadow:0 6px 16px -6px rgba(168,85,247,.5);}
  .tab-btn[data-tab="financeiro"].active{background:rgba(234,179,8,.18); border-color:var(--financeiro); color:#fde68a; box-shadow:0 6px 16px -6px rgba(234,179,8,.5);}
  .tab-btn[data-tab="resumo"].active{background:rgba(16,185,129,.18); border-color:var(--resumo); color:#6ee7b7; box-shadow:0 6px 16px -6px rgba(16,185,129,.5);}

  .panel{display:none;}
  .panel.active{display:block; animation:fadeUp .35s ease both;}

  .regiao{margin-bottom:11px; border-radius:15px; overflow:hidden; border:1px solid var(--border-color); background:var(--bg-card);
    animation:fadeUp .4s ease both;}
  .regiao-head{width:100%; display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:none; border:none; text-align:left; color:var(--text-main); cursor:pointer;}
  .regiao-head .titulo{font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .regiao-head .badge-first{font-size:9px; font-weight:800; background:rgba(255,255,255,.1); color:#cbd5e1; padding:2px 7px; border-radius:20px; letter-spacing:.4px;}
  .regiao-head .meta-mini{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .regiao-head .pct-badge{font-size:12px; font-weight:800; padding:3px 9px; border-radius:20px; flex:none;}
  .regiao-body{max-height:0; overflow:hidden; transition:max-height .45s cubic-bezier(.22,1,.36,1);}
  .regiao-body.open{max-height:3000px;}
  .chev{transition:transform .25s ease; color:var(--text-muted); font-size:11px; margin-left:8px;}
  .regiao-head.open .chev{transform:rotate(180deg);}
  .head-right{display:flex; align-items:center;}

  .item{padding:11px 14px; border-top:1px solid var(--border-color); background:var(--bg-item2);
    animation:fadeUp .3s ease both;}
  .item-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .item-city{font-size:13.5px; font-weight:700;}
  .item-lider{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
  .item-right{text-align:right; flex:none;}
  .item-votes{font-size:14px; font-weight:800;}
  .item-votes small{font-size:11px; font-weight:600; color:var(--text-muted);}
  .item-track{height:4px; background:#0b1120; border-radius:3px; margin-top:8px; overflow:hidden;}
  .item-fill{height:100%; width:0; transition:width .9s cubic-bezier(.22,1,.36,1);}
  .chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .chip{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:#0b1120; border:1px solid var(--border-color); color:var(--text-muted);}

  .fin-item .item-right .item-votes{color:var(--financeiro);}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:6px; display:inline-block;}
  .status-pendente{background:var(--red-bg); color:#fca5a5;}
  .status-parcial{background:var(--amber-bg); color:#fde047;}
  .status-pago{background:var(--green-bg); color:#6ee7b7;}

  .resumo-card{background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:16px; margin-bottom:12px; animation:fadeUp .4s ease both;}
  .resumo-card h3{font-size:15px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:6px;}
  .resumo-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--border-color);}
  .resumo-row:first-of-type{border-top:none;}
  .resumo-row .rl{font-size:12.5px; color:var(--text-muted);}
  .resumo-row .rv{font-size:14px; font-weight:800;}
  .resumo-track{height:6px; border-radius:4px; background:#0b1120; overflow:hidden; margin-top:6px;}
  .resumo-fill{height:100%; width:0; transition:width 1s cubic-bezier(.22,1,.36,1);}

  /* ---- MAPA ---- */
  .map-card{background:var(--bg-card); border:1px solid var(--border-color); border-radius:20px; padding:14px 10px 6px 10px; margin-bottom:16px; animation:fadeUp .5s ease both;}
  .map-card .map-head{display:flex; justify-content:space-between; align-items:center; padding:2px 8px 10px 8px;}
  .map-card .map-head h3{font-size:15px; font-weight:800;}
  .map-card .map-head .live{font-size:10px; font-weight:700; color:#6ee7b7; display:flex; align-items:center; gap:5px;}
  .map-card .map-head .live .dot{width:6px; height:6px; border-radius:50%; background:#34d399; animation:livepulse 1.8s infinite;}
  .mg-svg-wrap{width:100%; animation:floaty 6s ease-in-out infinite;}
  .mg-svg-wrap svg{width:100%; height:auto; display:block;}
  .marker{cursor:pointer; animation:fadeIn .6s ease both; animation-delay:var(--d);}
  .marker-pulse{animation:pulseRing 2.4s ease-out infinite; transform-origin:center; transform-box:fill-box;}
  .marker-dot{transition:r .2s ease;}
  .marker:active .marker-dot{r:9;}
  .map-legend{display:flex; justify-content:center; gap:14px; padding:10px 4px 12px 4px; flex-wrap:wrap;}
  .map-legend .leg{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); font-weight:600;}
  .map-legend .sw{width:9px; height:9px; border-radius:50%;}
  .map-tooltip{
    position:absolute; background:#0b1120; border:1px solid var(--border-color); border-radius:12px; padding:9px 12px;
    font-size:12px; pointer-events:none; opacity:0; transform:translate(-50%,-115%) scale(.92); transition:opacity .18s ease, transform .18s ease;
    z-index:5; white-space:nowrap; box-shadow:0 8px 24px -6px rgba(0,0,0,.5);
  }
  .map-tooltip.show{opacity:1; transform:translate(-50%,-125%) scale(1);}
  .map-tooltip .tt-city{font-weight:800; font-size:12.5px;}
  .map-tooltip .tt-sub{color:var(--text-muted); font-size:11px; margin-top:2px;}
  .map-wrap-rel{position:relative;}

  .footer-note{text-align:center; font-size:11px; color:var(--text-muted); padding:14px 10px 0 10px;}

  @media (min-width: 640px){
    .container{max-width:760px;}
    .hero .big{font-size:52px;}
    .resumo-card{padding:20px;}
  }
</style>
</head>

function fmtN(n){ return Math.round(n).toLocaleString('pt-BR'); }

function animateCount(el, to, suffix){
  const dur = 900, start = performance.now();
  function step(t){
    const p = Math.min((t-start)/dur, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(to*eased) + (suffix||'');
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderHero(){
  const metaF = VOTOS_FEDERAL.reduce((s,v)=>s+v.meta,0);
  const garF = VOTOS_FEDERAL.reduce((s,v)=>s+v.garantido,0);
  const metaE = VOTOS_ESTADUAL.reduce((s,v)=>s+v.meta,0);
  const garE = VOTOS_ESTADUAL.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
  const meta = metaF+metaE, gar = garF+garE;
  const pct = meta>0 ? gar/meta : 0;
  const pctEl = document.getElementById('heroPct');
  animateCount(pctEl, Math.round(pct*100), '%');
  pctEl.style.color = corPct(pct);
  document.getElementById('heroSub').textContent = fmtN(gar)+' votos garantidos de uma meta de '+fmtN(meta);
  const fill = document.getElementById('heroFill');
  requestAnimationFrame(()=>{ fill.style.width = Math.min(pct*100,100)+'%'; fill.style.background = corPct(pct); });
}

function regiaoAccordion(container, regiao, statsHTML, pct, itensHTML, isOpen, onToggle, isFirst){
  const box = document.createElement('div');
  box.className = 'regiao';
  box.innerHTML = `
    <button class="regiao-head ${isOpen?'open':''}">
      <div><div class="titulo">${regiao} ${isFirst?'<span class="badge-first">PRIORIDADE</span>':''}</div><div class="meta-mini">${statsHTML}</div></div>
      <div class="head-right"><span class="pct-badge" style="background:${corPct(pct)}22; color:${corPct(pct)}">${(pct*100).toFixed(0)}%</span><span class="chev">▾</span></div>
    </button>
    <div class="regiao-body ${isOpen?'open':''}">${itensHTML}</div>
  `;
  container.appendChild(box);
  box.querySelector('.regiao-head').addEventListener('click', onToggle);
  return box;
}

function renderFederal(){
  const cont = document.getElementById('panel-federal');
  cont.innerHTML = '';
  REGIOES.forEach((regiao,ridx)=>{
    const itens = VOTOS_FEDERAL.filter(v=>v.regiao===regiao);
    if(itens.length===0) return;
    const metaR = itens.reduce((s,v)=>s+v.meta,0);
    const garR = itens.reduce((s,v)=>s+v.garantido,0);
    const pctR = metaR>0 ? garR/metaR : 0;
    const itensHTML = itens.map(v=>{
      const p = v.meta>0 ? v.garantido/v.meta : 0;
      return `
        <div class="item">
          <div class="item-row">
            <div><div class="item-city">${v.cidade}</div><div class="item-lider">${nomeLider(v)}</div></div>
            <div class="item-right"><div class="item-votes">${fmtN(v.garantido)} <small>/ ${fmtN(v.meta)}</small></div></div>
          </div>
          <div class="item-track"><div class="item-fill" data-w="${Math.min(p*100,100)}" style="background:${corPct(p)};"></div></div>
        </div>`;
    }).join('');
    const box = regiaoAccordion(cont, regiao, `${fmtN(garR)} de ${fmtN(metaR)} votos`, pctR, itensHTML, openState.federal[regiao], ()=>{
      openState.federal[regiao] = !openState.federal[regiao]; renderFederal();
    }, ridx===0);
    if(openState.federal[regiao]) requestAnimationFrame(()=>animateFills(box));
  });
}

    const pctR = metaR>0 ? garR/metaR : 0;
    const itensHTML = itens.map(v=>{
      const total = v.pedro+v.neilando+v.vitorio;
      const p = v.meta>0 ? total/v.meta : 0;
      const chips = [];
      if(v.pedro>0) chips.push(`<span class="chip">Pedro ${fmtN(v.pedro)}</span>`);

function buildMapSvg(){
  let markersHtml = '';

    const color = corPct(m.pct);
    const r = m.meta>0 ? (7 + 9*Math.min(m.meta/500,1)) : 8;
    const delay = (i%6)*0.15;
    markersHtml += `
    <g class="marker" data-idx="${i}" style="--d:${delay}s">
      <circle class="marker-pulse" cx="${m.x}" cy="${m.y}" r="${r}" fill="${color}" opacity="0.35"></circle>
      <circle class="marker-dot" cx="${m.x}" cy="${m.y}" r="${Math.max(r*0.5,5)}" fill="${color}" stroke="#0b1120" stroke-width="1.5"></circle>
    </g>`;
  });
  return `
  <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="mgFill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1b2748"/>
        <stop offset="100%" stop-color="#131b30"/>

function renderResumo(){
  const cont = document.getElementById('panel-resumo');
  cont.innerHTML = '';

  const mapCard = document.createElement('div');
  mapCard.className = 'map-card';
  mapCard.innerHTML = `
    <div class="map-head">
      <h3>Minas Gerais — mapa da campanha</h3>
      <div class="live"><span class="dot"></span>Ao vivo</div>
    </div>
    <div class="map-wrap-rel">
      <div class="mg-svg-wrap">${buildMapSvg()}</div>
      <div class="map-tooltip" id="mapTooltip"></div>
    </div>
    <div class="map-legend">
      <span class="leg"><span class="sw" style="background:#3b82f6"></span>Metropolitana</span>
      <span class="leg"><span class="sw" style="background:#a855f7"></span>Vale do Jequitinhonha</span>
      <span class="leg"><span class="sw" style="background:#10b981"></span>Central</span>
    </div>
    <div class="map-legend" style="padding-top:0;">
      <span class="leg"><span class="sw" style="background:#10b981"></span>Meta encaminhada</span>
      <span class="leg"><span class="sw" style="background:#eab308"></span>Parcial</span>
      <span class="leg"><span class="sw" style="background:#ef4444"></span>Distante</span>
    </div>
  `;
  cont.appendChild(mapCard);

  const tooltip = mapCard.querySelector('#mapTooltip');
  mapCard.querySelectorAll('.marker').forEach(g=>{
    const idx = Number(g.getAttribute('data-idx'));
    const m = MARKERS[idx];
    g.addEventListener('click', (e)=>{
      const svg = g.closest('svg');
      const pt = svg.createSVGPoint();
      pt.x = m.x; pt.y = m.y;
      const screenCTM = svg.getScreenCTM();
      const transformed = pt.matrixTransform(screenCTM);
      const wrapRect = mapCard.querySelector('.map-wrap-rel').getBoundingClientRect();
      tooltip.style.left = (transformed.x - wrapRect.left) + 'px';
      tooltip.style.top = (transformed.y - wrapRect.top) + 'px';
      tooltip.innerHTML = `<div class="tt-city">${m.cidade}</div><div class="tt-sub">${fmtN(m.gar)} de ${fmtN(m.meta)} votos · ${(m.pct*100).toFixed(0)}%</div>`;
      tooltip.classList.add('show');
      clearTimeout(tooltip._t);
      tooltip._t = setTimeout(()=>tooltip.classList.remove('show'), 2600);
    });
  });

  const metaFT = VOTOS_FEDERAL.reduce((s,v)=>s+v.meta,0);
  const garFT = VOTOS_FEDERAL.reduce((s,v)=>s+v.garantido,0);
  const metaET = VOTOS_ESTADUAL.reduce((s,v)=>s+v.meta,0);
  const garET = VOTOS_ESTADUAL.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
  const orcT = FINANCEIRO.reduce((s,f)=>s+f.orcado,0);
  const pagT = FINANCEIRO.reduce((s,f)=>s+f.pago,0);

  const totalCard = document.createElement('div');
  totalCard.className = 'resumo-card';
  totalCard.style.border = '1.5px solid #3d4b6e';
  totalCard.innerHTML = `
    <h3>Total geral da campanha</h3>
    <div class="resumo-row"><span class="rl">Federal — Duílio</span><span class="rv" style="color:var(--federal)">${fmtN(garFT)} / ${fmtN(metaFT)}</span></div>
    <div class="resumo-row"><span class="rl">Estaduais (soma)</span><span class="rv" style="color:var(--estadual)">${fmtN(garET)} / ${fmtN(metaET)}</span></div>
    <div class="resumo-row"><span class="rl">Investimento</span><span class="rv" style="color:var(--financeiro)">${fmtR(pagT)} / ${fmtR(orcT)}</span></div>
  `;
  cont.appendChild(totalCard);

  REGIOES.forEach(regiao=>{
    const fed = VOTOS_FEDERAL.filter(v=>v.regiao===regiao);
    const est = VOTOS_ESTADUAL.filter(v=>v.regiao===regiao);
    const fin = FINANCEIRO.filter(f=>f.regiao===regiao);
    const metaF = fed.reduce((s,v)=>s+v.meta,0);
    const garF = fed.reduce((s,v)=>s+v.garantido,0);
    const metaE = est.reduce((s,v)=>s+v.meta,0);
    const garE = est.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
    const orc = fin.reduce((s,f)=>s+f.orcado,0);
    const pag = fin.reduce((s,f)=>s+f.pago,0);
    const pctF = metaF>0 ? garF/metaF : 0;
    const pctE = metaE>0 ? garE/metaE : 0;
    const card = document.createElement('div');
    card.className = 'resumo-card';
    card.innerHTML = `
      <h3>${regiao}</h3>
      <div class="resumo-row"><span class="rl">Federal (Duílio)</span><span class="rv" style="color:var(--federal)">${fmtN(garF)} / ${fmtN(metaF)}</span></div>
      <div class="resumo-track"><div class="resumo-fill" data-w="${Math.min(pctF*100,100)}" style="background:var(--federal);"></div></div>
      <div class="resumo-row"><span class="rl">Estaduais (soma)</span><span class="rv" style="color:var(--estadual)">${fmtN(garE)} / ${fmtN(metaE)}</span></div>
      <div class="resumo-track"><div class="resumo-fill" data-w="${Math.min(pctE*100,100)}" style="background:var(--estadual);"></div></div>
      <div class="resumo-row"><span class="rl">Investimento</span><span class="rv" style="color:var(--financeiro)">${fmtR(pag)} / ${fmtR(orc)}</span></div>
    `;
    cont.appendChild(card);
  });
  requestAnimationFrame(()=>animateFills(cont));
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    const panel = document.getElementById('panel-'+btn.dataset.tab);
    panel.classList.add('active');
    requestAnimationFrame(()=>animateFills(panel));
  });
});

renderHero();
renderFederal();
renderEstadual();
renderFinanceiro();
renderResumo();
</script>
</body>
</html>
