<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral da Campanha</title>
    <!-- Importação de fonte moderna e ícones -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1e3a8a; /* Azul escuro institucional */
            --primary-light: #eff6ff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cabeçalho */
        header {
            margin-bottom: 32px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            padding: 32px;
            border-radius: 16px;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        /* Grid de Resumos (Cards Grandes) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .icon-blue { background-color: #eff6ff; color: #3b82f6; }
        .icon-green { background-color: #ecfdf5; color: #10b981; }
        .icon-orange { background-color: #fffbeb; color: #f59e0b; }

        .card-info .label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .card-info .value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Container da Planilha Viva */
        .spreadsheet-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .spreadsheet-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fafafa;
        }

        .spreadsheet-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--success);
            background-color: #ecfdf5;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            body { padding: 12px; }
            header { padding: 20px; }
            header h1 { font-size: 22px; }
            iframe { height: 550px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho Principal -->
        <header>
            <h1><i class="fa-solid fa-chart-line"></i> Painel Geral da Campanha</h1>
            <p>Vale do Jequitinhonha, Região Metropolitana e Central — Gestão Estratégica de Votos e Recursos</p>
        </header>

        <!-- Indicadores Rápidos de Performance fixados a partir do seu cenário atual -->
        <div class="stats-grid">
            <div class="card">
                <div class="card-icon icon-blue"><i class="fa-solid fa-users"></i></div>
                <div class="card-info">
                    <div class="label">Meta Total Federal</div>
                    <div class="value">2.620</div>
                </div>
            </div>
            <div class="card">
                <div class="card-icon icon-green"><i class="fa-solid fa-user-check"></i></div>
                <div class="card-info">
                    <div class="label">Garantido Federal</div>
                    <div class="value">1.810</div>
                </div>
            </div>
            <div class="card">
                <div class="card-icon icon-orange"><i class="fa-solid fa-layer-group"></i></div>
                <div class="card-info">
                    <div class="label">Meta Estaduais</div>
                    <div class="value">4.480</div>
                </div>
            </div>
            <div class="card">
                <div class="card-icon icon-green"><i class="fa-solid fa-check-double"></i></div>
                <div class="card-info">
                    <div class="label">Garantido Estaduais</div>
                    <div class="value">3.010</div>
                </div>
            </div>
        </div>

        <!-- Seção da Planilha do Google Sheets Incorporada -->
        <div class="spreadsheet-container">
            <div class="spreadsheet-header">
                <div class="spreadsheet-title">
                    <i class="fa-solid fa-table" style="color: #0f9d58;"></i> Planilha de Dados Operacionais
                </div>
                <div class="live-indicator">
                    <div class="pulse"></div> Sincronizado ao Vivo
                </div>
            </div>
            
            <!-- Link da sua planilha pública fornecida -->
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTFfj9q_UJnULW8wEWNO5Br0wEabAo79Dme3UKaSFQPcT9VZ5Ar6kMryVIfcsVNo7B1us-r4RXUC7jO/pubhtml?widget=true&amp;headers=false"></iframe>
        </div>
    </div>

</body>
</html>
