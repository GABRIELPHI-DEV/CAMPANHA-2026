<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Campanha 2026 — Painel de Estatísticas</title>
<style>
  :root{
    --bg-main:#0b1120;
    --bg-card:#151d30;
    --bg-item:#1b2438;
    --border-color:#2a3550;
    --text-main:#f8fafc;
    --text-muted:#8b96ab;

    --federal:#3b82f6;
    --estadual:#a855f7;
    --financeiro:#eab308;
    --resumo:#10b981;

    --green:#10b981;   --green-bg:rgba(16,185,129,.14);
    --amber:#eab308;   --amber-bg:rgba(234,179,8,.14);
    --red:#ef4444;     --red-bg:rgba(239,68,68,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-main); color:var(--text-main);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding:16px 12px 36px 12px;
  }
  .container{max-width:640px; margin:0 auto;}

  header{text-align:center; padding:6px 8px 18px 8px;}
  header h1{font-size:19px; font-weight:800; letter-spacing:-.2px;}
  header p{font-size:12.5px; color:var(--text-muted); margin-top:4px;}

  /* estatistica principal, grande e direta */
  .hero{
    background:linear-gradient(135deg,#111a2e,#182036);
    border:1px solid var(--border-color);
    border-radius:18px;
    padding:20px 18px;
    margin-bottom:14px;
    text-align:center;
  }
  .hero .tag{font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted);}
  .hero .big{font-size:38px; font-weight:800; margin:6px 0 2px 0;}
  .hero .sub{font-size:13px; color:var(--text-muted);}
  .hero .ring-track{height:10px; border-radius:6px; background:#0b1120; margin-top:14px; overflow:hidden;}
  .hero .ring-fill{height:100%; border-radius:6px;}

  .tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px;}
  .tab-btn{
    background:var(--bg-card); border:1px solid var(--border-color); color:var(--text-muted);
    padding:10px 4px; border-radius:11px; font-size:11px; font-weight:700; text-align:center;
  }
  .tab-btn .dot{display:block; width:7px; height:7px; border-radius:50%; margin:0 auto 5px auto;}
  .tab-btn[data-tab="federal"] .dot{background:var(--federal);}
  .tab-btn[data-tab="estadual"] .dot{background:var(--estadual);}
  .tab-btn[data-tab="financeiro"] .dot{background:var(--financeiro);}
  .tab-btn[data-tab="resumo"] .dot{background:var(--resumo);}
  .tab-btn.active{color:#fff; border-color:currentColor;}
  .tab-btn[data-tab="federal"].active{background:rgba(59,130,246,.16); border-color:var(--federal); color:#93c5fd;}
  .tab-btn[data-tab="estadual"].active{background:rgba(168,85,247,.16); border-color:var(--estadual); color:#d8b4fe;}
  .tab-btn[data-tab="financeiro"].active{background:rgba(234,179,8,.16); border-color:var(--financeiro); color:#fde68a;}
  .tab-btn[data-tab="resumo"].active{background:rgba(16,185,129,.16); border-color:var(--resumo); color:#6ee7b7;}

  .panel{display:none;}
  .panel.active{display:block;}

  .regiao{margin-bottom:10px; border-radius:14px; overflow:hidden; border:1px solid var(--border-color); background:var(--bg-card);}
  .regiao-head{width:100%; display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:none; border:none; text-align:left; color:var(--text-main);}
  .regiao-head .titulo{font-size:14px; font-weight:700;}
  .regiao-head .meta-mini{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .regiao-head .pct-badge{font-size:12px; font-weight:800; padding:3px 9px; border-radius:20px; flex:none;}
  .regiao-body{display:none;}
  .regiao-body.open{display:block;}
  .chev{transition:transform .2s ease; color:var(--text-muted); font-size:11px; margin-left:8px;}
  .regiao-head.open .chev{transform:rotate(180deg);}
  .head-right{display:flex; align-items:center;}

  .item{padding:11px 14px; border-top:1px solid var(--border-color); background:var(--bg-item);}
  .item-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .item-city{font-size:13.5px; font-weight:700;}
  .item-lider{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
  .item-right{text-align:right; flex:none;}
  .item-votes{font-size:14px; font-weight:800;}
  .item-votes small{font-size:11px; font-weight:600; color:var(--text-muted);}
  .item-track{height:4px; background:#0b1120; border-radius:3px; margin-top:8px; overflow:hidden;}
  .item-fill{height:100%;}
  .chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .chip{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:#0b1120; border:1px solid var(--border-color); color:var(--text-muted);}

  /* financeiro */
  .fin-item .item-right .item-votes{color:var(--financeiro);}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:6px; display:inline-block;}
  .status-pendente{background:var(--red-bg); color:#fca5a5;}
  .status-parcial{background:var(--amber-bg); color:#fde047;}
  .status-pago{background:var(--green-bg); color:#6ee7b7;}

  /* resumo */
  .resumo-card{background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:16px; margin-bottom:12px;}
  .resumo-card h3{font-size:15px; font-weight:800; margin-bottom:12px;}
  .resumo-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--border-color);}
  .resumo-row:first-of-type{border-top:none;}
  .resumo-row .rl{font-size:12.5px; color:var(--text-muted);}
  .resumo-row .rv{font-size:14px; font-weight:800;}
  .resumo-track{height:6px; border-radius:4px; background:#0b1120; overflow:hidden; margin-top:6px;}
  .resumo-fill{height:100%;}

  .footer-note{text-align:center; font-size:11px; color:var(--text-muted); padding:14px 10px 0 10px;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Campanha 2026</h1>
    <p>Painel de estatísticas — Vale do Jequitinhonha, Metropolitana e Central</p>
  </header>

  <div class="hero">
    <div class="tag">Progresso geral (Federal + Estaduais)</div>
    <div class="big" id="heroPct">—</div>
    <div class="sub" id="heroSub">carregando…</div>
    <div class="ring-track"><div class="ring-fill" id="heroFill" style="width:0%"></div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="federal"><span class="dot"></span>Federal</button>
    <button class="tab-btn" data-tab="estadual"><span class="dot"></span>Estaduais</button>
    <button class="tab-btn" data-tab="financeiro"><span class="dot"></span>Financeiro</button>
    <button class="tab-btn" data-tab="resumo"><span class="dot"></span>Resumo</button>
  </div>

  <div class="panel active" id="panel-federal"></div>
  <div class="panel" id="panel-estadual"></div>
  <div class="panel" id="panel-financeiro"></div>
  <div class="panel" id="panel-resumo"></div>

  <div class="footer-note">Painel de apresentação — somente visualização.</div>
</div>

function fmtN(n){ return Math.round(n).toLocaleString('pt-BR'); }
function fmtR(n){ return "R$ " + Math.round(n).toLocaleString('pt-BR'); }
function corPct(p){ if(p>=0.66) return '#10b981'; if(p>=0.33) return '#eab308'; return '#ef4444'; }
function nomeLider(v){ return (v.lideranca === "A definir") ? v.cidade : v.lideranca; }
function statusFin(f){ if(f.orcado<=0) return null; if(f.pago<=0) return 'Pendente'; if(f.pago<f.orcado) return 'Parcial'; return 'Pago'; }

let openState = {federal:{}, estadual:{}, financeiro:{}};
REGIOES.forEach(r=>{ openState.federal[r]=true; openState.estadual[r]=false; openState.financeiro[r]=false; });

function renderHero(){
  const metaF = VOTOS_FEDERAL.reduce((s,v)=>s+v.meta,0);
  const garF = VOTOS_FEDERAL.reduce((s,v)=>s+v.garantido,0);
  const metaE = VOTOS_ESTADUAL.reduce((s,v)=>s+v.meta,0);
  const garE = VOTOS_ESTADUAL.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
  const meta = metaF+metaE, gar = garF+garE;
  const pct = meta>0 ? gar/meta : 0;
  document.getElementById('heroPct').textContent = (pct*100).toFixed(0)+'%';
  document.getElementById('heroPct').style.color = corPct(pct);
  document.getElementById('heroSub').textContent = fmtN(gar)+' votos garantidos de uma meta de '+fmtN(meta);
  document.getElementById('heroFill').style.width = Math.min(pct*100,100)+'%';
  document.getElementById('heroFill').style.background = corPct(pct);
}

function regiaoAccordion(container, regiao, statsHTML, pct, colorVar, itensHTML, isOpen, onToggle){
  const box = document.createElement('div');
  box.className = 'regiao';
  box.innerHTML = `
    <button class="regiao-head ${isOpen?'open':''}">
      <div><div class="titulo">${regiao}</div><div class="meta-mini">${statsHTML}</div></div>
      <div class="head-right"><span class="pct-badge" style="background:${corPct(pct)}22; color:${corPct(pct)}">${(pct*100).toFixed(0)}%</span><span class="chev">▾</span></div>
    </button>
    <div class="regiao-body ${isOpen?'open':''}">${itensHTML}</div>
  `;
  container.appendChild(box);
  box.querySelector('.regiao-head').addEventListener('click', onToggle);
}

function renderFederal(){
  const cont = document.getElementById('panel-federal');
  cont.innerHTML = '';
  REGIOES.forEach(regiao=>{
    const itens = VOTOS_FEDERAL.filter(v=>v.regiao===regiao);
    if(itens.length===0) return;
    const metaR = itens.reduce((s,v)=>s+v.meta,0);
    const garR = itens.reduce((s,v)=>s+v.garantido,0);
    const pctR = metaR>0 ? garR/metaR : 0;
    const itensHTML = itens.map(v=>{
      const p = v.meta>0 ? v.garantido/v.meta : 0;
      return `
        <div class="item">
          <div class="item-row">
            <div><div class="item-city">${v.cidade}</div><div class="item-lider">${nomeLider(v)}</div></div>
            <div class="item-right"><div class="item-votes">${fmtN(v.garantido)} <small>/ ${fmtN(v.meta)}</small></div></div>
          </div>
          <div class="item-track"><div class="item-fill" style="width:${Math.min(p*100,100)}%; background:${corPct(p)};"></div></div>
        </div>`;
    }).join('');
    regiaoAccordion(cont, regiao, `${fmtN(garR)} de ${fmtN(metaR)} votos`, pctR, '--federal', itensHTML, openState.federal[regiao], ()=>{
      openState.federal[regiao] = !openState.federal[regiao]; renderFederal();
    });
  });
}

function renderEstadual(){

  REGIOES.forEach(regiao=>{

    if(itens.length===0) return;
    const metaR = itens.reduce((s,v)=>s+v.meta,0);
    const garR = itens.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
    const pctR = metaR>0 ? garR/metaR : 0;
    const itensHTML = itens.map(v=>{
      const total = v.pedro+v.neilando+v.vitorio;
      const p = v.meta>0 ? total/v.meta : 0;
      const chips = [];
      if(v.pedro>0) chips.push(`<span class="chip">Pedro ${fmtN(v.pedro)}</span>`);
      if(v.neilando>0) chips.push(`<span class="chip">Neilando ${fmtN(v.neilando)}</span>`);
      if(v.vitorio>0) chips.push(`<span class="chip">Vitório ${fmtN(v.vitorio)}</span>`);
      return `
        <div class="item">
          <div class="item-row">
            <div><div class="item-city">${v.cidade}</div><div class="item-lider">${nomeLider(v)}</div></div>
            <div class="item-right"><div class="item-votes">${fmtN(total)} <small>/ ${fmtN(v.meta)}</small></div></div>
          </div>
          <div class="item-track"><div class="item-fill" style="width:${Math.min(p*100,100)}%; background:${corPct(p)};"></div></div>
          ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
        </div>`;
    }).join('');
    regiaoAccordion(cont, regiao, `${fmtN(garR)} de ${fmtN(metaR)} votos`, pctR, '--estadual', itensHTML, openState.estadual[regiao], ()=>{
      openState.estadual[regiao] = !openState.estadual[regiao]; renderEstadual();
    });
  });
}

function renderFinanceiro(){
  const cont = document.getElementById('panel-financeiro');
  cont.innerHTML = '';
  REGIOES.forEach(regiao=>{
    const itens = FINANCEIRO.filter(f=>f.regiao===regiao);
    if(itens.length===0) return;
    const orcR = itens.reduce((s,f)=>s+f.orcado,0);
    const pagR = itens.reduce((s,f)=>s+f.pago,0);
    const pctR = orcR>0 ? pagR/orcR : 0;
    const itensHTML = itens.map(f=>{
      const st = statusFin(f);
      return `
        <div class="item fin-item">
          <div class="item-row">
            <div><div class="item-city">${f.pessoa}</div><div class="item-lider">${f.cidade} · ${f.categoria}</div></div>
            <div class="item-right"><div class="item-votes">${fmtR(f.orcado)}</div>${st ? `<div class="status-pill status-${st.toLowerCase()}">${st}</div>` : ''}</div>
          </div>
        </div>`;
    }).join('');
    regiaoAccordion(cont, regiao, `${fmtR(pagR)} pago de ${fmtR(orcR)}`, pctR, '--financeiro', itensHTML, openState.financeiro[regiao], ()=>{
      openState.financeiro[regiao] = !openState.financeiro[regiao]; renderFinanceiro();
    });
  });
}

function renderResumo(){
  const cont = document.getElementById('panel-resumo');
  cont.innerHTML = '';
  const metaFT = VOTOS_FEDERAL.reduce((s,v)=>s+v.meta,0);
  const garFT = VOTOS_FEDERAL.reduce((s,v)=>s+v.garantido,0);
  const metaET = VOTOS_ESTADUAL.reduce((s,v)=>s+v.meta,0);
  const garET = VOTOS_ESTADUAL.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
  const orcT = FINANCEIRO.reduce((s,f)=>s+f.orcado,0);
  const pagT = FINANCEIRO.reduce((s,f)=>s+f.pago,0);

  const totalCard = document.createElement('div');
  totalCard.className = 'resumo-card';
  totalCard.style.border = '1.5px solid #3d4b6e';
  totalCard.innerHTML = `
    <h3>Total geral da campanha</h3>
    <div class="resumo-row"><span class="rl">Federal — Duílio</span><span class="rv" style="color:var(--federal)">${fmtN(garFT)} / ${fmtN(metaFT)}</span></div>
    <div class="resumo-row"><span class="rl">Estaduais (soma)</span><span class="rv" style="color:var(--estadual)">${fmtN(garET)} / ${fmtN(metaET)}</span></div>
    <div class="resumo-row"><span class="rl">Investimento</span><span class="rv" style="color:var(--financeiro)">${fmtR(pagT)} / ${fmtR(orcT)}</span></div>
  `;
  cont.appendChild(totalCard);

  REGIOES.forEach(regiao=>{
    const fed = VOTOS_FEDERAL.filter(v=>v.regiao===regiao);
    const est = VOTOS_ESTADUAL.filter(v=>v.regiao===regiao);
    const fin = FINANCEIRO.filter(f=>f.regiao===regiao);
    const metaF = fed.reduce((s,v)=>s+v.meta,0);
    const garF = fed.reduce((s,v)=>s+v.garantido,0);
    const metaE = est.reduce((s,v)=>s+v.meta,0);
    const garE = est.reduce((s,v)=>s+v.pedro+v.neilando+v.vitorio,0);
    const orc = fin.reduce((s,f)=>s+f.orcado,0);
    const pag = fin.reduce((s,f)=>s+f.pago,0);
    const pctF = metaF>0 ? garF/metaF : 0;
    const pctE = metaE>0 ? garE/metaE : 0;
    const card = document.createElement('div');
    card.className = 'resumo-card';
    card.innerHTML = `
      <h3>${regiao}</h3>
      <div class="resumo-row"><span class="rl">Federal (Duílio)</span><span class="rv" style="color:var(--federal)">${fmtN(garF)} / ${fmtN(metaF)}</span></div>
      <div class="resumo-track"><div class="resumo-fill" style="width:${Math.min(pctF*100,100)}%; background:var(--federal);"></div></div>
      <div class="resumo-row"><span class="rl">Estaduais (soma)</span><span class="rv" style="color:var(--estadual)">${fmtN(garE)} / ${fmtN(metaE)}</span></div>
      <div class="resumo-track"><div class="resumo-fill" style="width:${Math.min(pctE*100,100)}%; background:var(--estadual);"></div></div>
      <div class="resumo-row"><span class="rl">Investimento</span><span class="rv" style="color:var(--financeiro)">${fmtR(pag)} / ${fmtR(orc)}</span></div>
    `;
    cont.appendChild(card);
  });
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

renderHero();
renderFederal();
renderEstadual();
renderFinanceiro();
renderResumo();
</script>
</body>
</html>
